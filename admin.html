<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e4">
<title>Admin · PrintBee</title>
<link rel="icon" href="/printbee-tab-bee.png">
<link rel="stylesheet" href="admin-tokens.css">
<link rel="stylesheet" href="admin-dashboard.css?v=staff-dock">
<link rel="stylesheet" href="hive-theme.css?v=soft-focus">
<link rel="stylesheet" href="admin-hive.css?v=partners">
<script src="hive-theme.js?v=sun-moon" data-follow-system="false"></script>
<link rel="stylesheet" href="admin-pricing.css">
<link rel="stylesheet" href="admin-ledger.css">
<link rel="stylesheet" href="admin-mobile.css">
<link rel="stylesheet" href="/staff-dock.css?v=page-beige">
<link rel="stylesheet" href="/status-model.css?v=2">
<style>
.live-gate{max-width:560px;margin:8vh auto;padding:0 16px;display:grid;gap:14px;justify-items:start}
.live-gate[hidden]{display:none}
.live-gate .card{padding:24px;display:grid;gap:14px;width:100%}
.live-gate a.primary{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:999px;text-decoration:none;font-weight:800;color:var(--hv-ink,#2a2112);background:var(--hv-honey-grad,#f5c542);box-shadow:var(--hv-sh-2,none);justify-self:start}
.live-gate a.primary:hover{filter:brightness(1.04)}
.live-gate a.primary:focus-visible{outline:3px solid var(--hv-ink,#2a2112);outline-offset:3px}
.profile-card{width:min(320px,calc(100vw - 32px));padding:0;overflow:hidden;display:grid}
.profile-head{display:flex;align-items:center;gap:12px;padding:18px 18px 16px;background:var(--hv-surface-2,#fff6dd)}
.profile-avatar{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--hv-honey-grad,#f5c542);color:#2a2112;font-weight:800;box-shadow:var(--hv-sh-1,none);flex:none}
.profile-head strong{display:block;font-size:16px;line-height:1.2}
.profile-head small{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--hv-muted,#6e5e3e);font-weight:700;font-size:13px}
.profile-dot{width:8px;height:8px;border-radius:50%;background:var(--hv-success,#3e8e5a);box-shadow:0 0 0 3px var(--hv-success-bg,#e2f2e7)}
.profile-card .pb-switch{margin:0;padding:14px 12px 6px;gap:4px}
.profile-card .pb-switch-title{padding:0 6px 4px}
.profile-card .pb-switch-list{display:grid;gap:2px;flex-wrap:nowrap}
.profile-card .pb-switch-link{min-height:42px;padding:0 12px;border-radius:12px;background:transparent;justify-content:space-between;font-size:15px}
.profile-card .pb-switch-link::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg);opacity:.45}
.profile-card .pb-switch-link:hover{background:var(--hv-surface-2,#fff6dd)}
.profile-foot{display:grid;gap:8px;padding:10px 12px 14px;margin-top:6px;border-top:1px solid var(--hv-border,#f0e3be)}
.profile-foot button{width:100%;min-height:44px;border-radius:12px;border:0;cursor:pointer;font:800 15px Manrope,system-ui,sans-serif;background:var(--hv-danger-bg,#fce3e0);color:var(--hv-danger-ink,#9a2626);box-shadow:none}
.profile-foot button:hover{filter:brightness(.97)}
.profile-foot button[hidden]{display:none}
.profile-foot a{text-align:center;font-weight:700;font-size:14px;color:var(--hv-muted,#6e5e3e);text-decoration:none;padding:4px}
.profile-foot a:hover{text-decoration:underline}
</style>
<script>
if (new URLSearchParams(location.search).get('preview') === '1') location.replace('/admin-preview.html');
</script>
<script src="/staff-dock.js?v=3" defer></script>
<script src="/status-model.js?v=1" defer></script>
<script src="/live.js?v=1" defer></script>
<script src="/portal-switch.js?v=1" defer></script>
<style>
/* Keep the sign-in card hidden until the session check finishes, so a signed-in refresh never flashes it.
   If the script never runs, the card appears after 2.5 s so nobody is locked out. */
#portal-login{visibility:hidden;animation:pb-login-reveal 0s 2.5s forwards}
@keyframes pb-login-reveal{to{visibility:visible}}
</style>
<script src="portal-login.js?v=one-login" defer></script>
<script type="module" src="admin-dashboard.js?v=partners"></script>
</head>
<body data-portal="admin">
<a class="skip" href="#main">Skip to dashboard</a>
<section class="live-gate">
  <h1>PrintBee Admin</h1>
  <div id="portal-login" class="card"><p>Sign in with your admin Google account to see live orders.</p><a class="primary" href="/api/auth/google?portal=admin">Continue with Google</a></div>
  <p id="ops-status" role="status"></p>
</section>
<div class="workspace" hidden>
  <aside class="sidebar" aria-label="Admin sidebar">
    <a class="brand" href="#dashboard"><img src="printbee-header-bee.webp" width="44" height="40" alt=""><span><strong>PrintBee</strong><small>Admin</small></span></a>
    <nav id="sidebar-nav" aria-label="Admin sections"></nav>
  </aside>
  <main id="main" tabindex="-1">
    <header class="toolbar">
      <button class="icon-button collapse" id="collapse" type="button" aria-label="Collapse sidebar" aria-expanded="true"></button>
      <label class="search-clay"><span id="search-icon" aria-hidden="true"></span><input id="global-search" type="search" aria-label="Search orders" placeholder="Search orders"></label>
      <button class="icon-button hv-switch" id="theme" data-hive-toggle type="button" aria-label="Dark mode" aria-pressed="false"></button>
      <button class="icon-button" id="notifications" type="button" aria-label="Notifications" aria-expanded="false" aria-controls="notification-panel"></button>
      <button class="avatar" id="profile" type="button" aria-label="Admin profile" aria-expanded="false" aria-controls="profile-panel">PB</button>
      <div class="popover card" id="notification-panel" hidden><h2>Notifications</h2><ul id="notification-list" class="activity"></ul></div>
      <div class="popover card profile-card" id="profile-panel" hidden>
        <div class="profile-head"><span class="profile-avatar" aria-hidden="true">PB</span><div><strong>PrintBee Admin</strong><small><i class="profile-dot"></i>Live workspace</small></div></div>
        <div class="pb-switch" data-portal-switch="admin" hidden></div>
        <div class="profile-foot">
          <button id="portal-logout" type="button" hidden>Sign out</button>
          <a href="mailto:printbee.co.in@gmail.com">Contact support</a>
        </div>
      </div>
    </header>
    <div id="admin-workarea" class="admin-workarea">
      <div class="intro">
        <div><h1 id="page-title">Dashboard</h1><p id="page-description">Track campus print orders, revenue, and delivery activity.</p></div>
        <div class="actions" data-page-actions="orders" hidden>
          <button id="add-order" class="primary" type="button">+ Add offline orders</button>
          <button id="export-csv" type="button">Export CSV</button>
          <button id="export-pdf" type="button">Print / Save PDF</button>
        </div>
        <div class="actions" data-page-actions="inventory" hidden>
          <button id="add-product" class="primary" type="button">+ Add product</button>
        </div>
        <div class="actions" data-page-actions="partners" hidden>
          <button id="add-partner" class="primary" type="button">+ Add verified partner</button>
        </div>
        <div class="actions" data-page-actions="warehouses" hidden>
          <button id="add-warehouse" class="primary" type="button">+ Add warehouse</button>
        </div>
      </div>
      <p id="notice" class="notice" role="status"></p>
      <div id="dashboard" aria-busy="true">
        <div class="skeletons" role="status" aria-label="Loading dashboard"><span></span><span></span><span></span></div>
      </div>
    </div>
  </main>
</div>
<nav id="preview-staff-dock" class="staff-dock" aria-label="Mobile admin sections" hidden></nav>
<dialog id="editor" aria-labelledby="editor-title">
  <form id="editor-form">
    <h2 id="editor-title"></h2>
    <div id="editor-fields"></div>
    <div class="actions"><button id="close-editor" type="button">Close</button><button class="primary" id="save-editor" type="submit">Save</button></div>
  </form>
</dialog>
</body>
</html>
