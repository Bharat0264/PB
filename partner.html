<!doctype html>
<html lang="en">
<head>
<script src="/portal-loader.js?v=1"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8E8">
<title>Delivery partner · PrintBee</title>
<link rel="manifest" href="/partner.webmanifest">
<link rel="icon" href="/printbee-tab-bee.png">
<link rel="preload" href="/manrope-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/partner.css?v=soft-focus">
<link rel="stylesheet" href="/hive-theme.css?v=soft-focus">
<script src="/hive-theme.js?v=sun-moon" data-palette="partner" data-follow-system="false"></script>
<style>
/* Keep the sign-in card hidden until the session check finishes, so a signed-in refresh never flashes it.
   If the script never runs, the card appears after 2.5 s so nobody is locked out. */
#portal-login{visibility:hidden;animation:pb-login-reveal 0s 2.5s forwards}
@keyframes pb-login-reveal{to{visibility:visible}}
</style>
<script src="/portal-login.js?v=loader" defer></script>
<link rel="stylesheet" href="/staff-dock.css?v=page-beige">
<script src="/staff-dock.js?v=3" defer></script>
<link rel="stylesheet" href="/status-model.css?v=2">
<script src="/status-model.js?v=1" defer></script>
<script src="/live.js?v=1" defer></script>
<script src="/portal-switch.js?v=1" defer></script>
<script src="/partner.js?v=acct-sheet" defer></script>
</head>
<body class="hive">
<a href="#main" class="hive-skip">Skip to deliveries</a>

<!-- Brand + floating top-right cluster -->
<a id="partner-home" class="hive-brand" href="/partner" aria-label="PrintBee Partner home">
  <img src="/printbee-header-bee.webp" alt="" width="44" height="35"><span>PrintBee <small>Partner</small></span>
</a>
<div class="hive-top" role="toolbar" aria-label="Quick actions">
  <span id="preview-chip" class="hive-chip" title="Illustrative orders and earnings" hidden>Sample data</span>
  <button id="rider-search" class="hive-icon" type="button" aria-label="Search and commands (Ctrl+K)" aria-keyshortcuts="Control+K Meta+K" hidden></button>
  <button id="rider-notifications" class="hive-icon" type="button" aria-label="Notifications" aria-haspopup="dialog" hidden></button>
  <button id="night-mode" class="hv-switch" type="button" data-hive-toggle aria-label="Moon Hive (night theme)" aria-pressed="false"></button>
  <button id="rider-avatar" class="hive-avatar" type="button" aria-label="Partner account" aria-haspopup="dialog" hidden>AK</button>
</div>

<!-- Floating dock (desktop) / bottom pill (tablet) / bottom nav (mobile) -->
<nav id="rider-nav" class="hive-dock" aria-label="Partner sections" hidden></nav>
<nav id="partner-staff-dock" class="staff-dock" aria-label="Mobile partner sections" hidden></nav>

<main id="main" class="hive-main" tabindex="-1">
  <div id="portal-login" class="hive-login">
    <div class="hive-login-card">
      <div class="hive-login-art" aria-hidden="true"></div>
      <h1>Ready to fly?</h1>
      <p>Sign in to see deliveries around the PrintBee hive.</p>
      <a class="hive-btn hive-btn-primary" href="/api/auth/google?portal=partner">Continue with Google</a>
      <details><summary>Sign in by phone</summary>
        <form id="phone-login"><label>Phone with country code<input name="phone" class="hive-input" type="tel" autocomplete="tel" required placeholder="+91"></label><label id="login-code" hidden>SMS code<input name="code" class="hive-input" inputmode="numeric" autocomplete="one-time-code" maxlength="10"></label><button class="hive-btn hive-btn-primary" type="submit">Send code</button></form>
      </details>
      <a class="hive-link" href="/partner?preview=1">Open the sample hive</a>
    </div>
  </div>
  <p id="network" class="hive-banner" role="status" hidden><span class="hive-banner-bee" aria-hidden="true"></span>You’re offline. Progress refreshes when you’re back.</p>
  <p id="ops-status" class="hive-toast" role="status" aria-live="polite"></p>
  <div id="rider-app" hidden>
    <div id="rider-content"></div>
  </div>
</main>

<div id="hive-activebar" class="hive-activebar" hidden></div>
<div id="hive-ripple" class="hive-ripple" aria-hidden="true"></div>
<p id="hive-live" class="hive-sr" aria-live="assertive"></p>

<dialog id="rider-dialog" class="hive-dialog" aria-labelledby="rider-dialog-title">
  <div class="hive-dialog-head"><h2 id="rider-dialog-title"></h2><form method="dialog"><button class="hive-icon" type="submit" aria-label="Close">✕</button></form></div>
  <div id="rider-dialog-body"></div>
  <button id="portal-logout" class="hive-btn" type="button" hidden>Sign out</button>
</dialog>

<dialog id="hive-palette" class="hive-dialog hive-palette" aria-label="Command palette">
  <div class="hive-palette-field">
    <input id="hive-palette-input" class="hive-input" type="text" role="combobox" aria-expanded="true" aria-controls="hive-palette-list" aria-autocomplete="list" placeholder="Type a command or order ID" autocomplete="off">
    <kbd>Esc</kbd>
  </div>
  <ul id="hive-palette-list" role="listbox" aria-label="Commands"></ul>
</dialog>
</body>
</html>
