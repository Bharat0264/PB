<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PrintBee warehouse</title>
<link rel="stylesheet" href="/clay.css?v=1">
<link rel="stylesheet" href="/warehouse.css?v=print-to-ready">
<link rel="stylesheet" href="/hive-theme.css?v=plain-clay">
<link rel="stylesheet" href="/warehouse-hive.css?v=plain-clay">
<script src="/hive-theme.js?v=1"></script>
<script src="/portal-login.js" defer></script>
<link rel="stylesheet" href="/staff-dock.css?v=1">
<script src="/staff-dock.js?v=1" defer></script>
<script src="/warehouse.js?v=staff-dock" defer></script>
</head>
<body class="warehouse">
<a class="wh-skip" href="#warehouse-main">Skip to warehouse</a>
<main id="warehouse-main">
  <section id="portal-login" class="clay-card wh-login" aria-labelledby="wh-login-title">
    <img src="/printbee-header-bee.webp" width="96" height="76" alt="">
    <h1 id="wh-login-title">Warehouse sign-in</h1>
    <a class="clay-button wh-primary" href="/api/auth/google?portal=warehouse">Continue with Google</a>
    <a class="wh-text-link" href="/warehouse?preview=1">Open sample dashboard</a>
  </section>
  <div class="warehouse-shell" id="warehouse-app" hidden>
    <aside class="wh-rail">
      <a class="wh-brand" href="/warehouse" aria-label="PrintBee warehouse"><img src="/printbee-header-bee.webp" width="42" height="38" alt=""></a>
      <nav id="warehouse-nav" aria-label="Warehouse sections"></nav>
      <details class="wh-account">
        <summary aria-label="PB staff account" title="Staff account"><span aria-hidden="true">PB</span></summary>
        <div class="clay-card wh-account-menu">
          <a id="warehouse-mode-link" href="/warehouse?preview=1">Open sample dashboard</a>
          <button id="portal-logout" type="button" class="clay-button" hidden>Sign out</button>
        </div>
      </details>
    </aside>
    <div class="wh-workspace">
      <header class="wh-top">
        <label class="wh-search"><span id="search-icon" aria-hidden="true"></span><span class="wh-sr">Search orders</span><input id="warehouse-search" type="search" placeholder="Search orders"><kbd aria-hidden="true">/</kbd></label>
        <div class="wh-indicators">
          <span class="wh-chip wh-agent" id="agent-status"></span>
          <span class="wh-today" id="today-count"></span>
          <button id="sound-toggle" type="button" class="wh-icon-button" aria-label="Order chime" aria-pressed="false"></button>
        </div>
      </header>
      <div class="wh-columns" id="warehouse-columns">
        <section class="wh-queue" aria-labelledby="warehouse-title">
          <p class="wh-context" id="warehouse-context">PrintBee Warehouse</p>
          <h1 id="warehouse-title">Mission control</h1>
          <div id="warehouse-content"><div class="wh-loading" role="status"><img src="/printbee-header-bee.webp" width="80" height="64" alt="">Loading paid orders<div class="clay-skeleton"></div></div></div>
        </section>
        <section id="warehouse-detail" class="clay-card wh-station" aria-labelledby="detail-title" tabindex="-1">
          <div class="wh-station-scroll">
            <div class="wh-station-head">
              <div><p class="wh-context">Order station</p><h2 id="detail-title">Select an order</h2></div>
              <button type="button" class="wh-icon-button" id="station-close" aria-label="Close order" hidden></button>
            </div>
            <div id="detail-body"></div>
          </div>
          <div id="detail-action" class="wh-action-dock" hidden></div>
        </section>
      </div>
    </div>
  </div>
  <nav id="warehouse-staff-dock" class="staff-dock" aria-label="Mobile warehouse sections" hidden></nav>
  <div id="warehouse-feedback" class="wh-feedback">
    <p id="staff-status" role="status"></p>
    <p id="detail-status" role="status"></p>
    <div id="warehouse-arrival" hidden></div>
  </div>
</main>
<dialog class="clay-card wh-dialog" id="warehouse-confirm" aria-labelledby="confirm-title">
  <h2 id="confirm-title">Confirm print</h2>
  <div id="confirm-body"></div>
  <form method="dialog" class="wh-dialog-actions">
    <button type="submit" value="cancel" class="clay-button">Cancel</button>
    <button type="submit" value="print" class="clay-button wh-primary">Print now</button>
  </form>
</dialog>
<dialog class="clay-card wh-dialog wh-preview" id="warehouse-preview" aria-labelledby="preview-title">
  <div class="wh-station-head"><h2 id="preview-title">Preview</h2><form method="dialog"><button class="clay-button">Close</button></form></div>
  <div id="preview-body"></div>
</dialog>
<dialog class="clay-card wh-dialog" id="warehouse-new" aria-labelledby="arrival-title">
  <h2 id="arrival-title">New paid order</h2>
  <p id="arrival-number"></p>
  <form method="dialog" class="wh-dialog-actions"><button class="clay-button" value="dismiss">Dismiss</button><button class="clay-button wh-primary" value="open">Open order</button></form>
</dialog>
</body>
</html>
