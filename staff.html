<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintBee staff portal</title>
<link rel="stylesheet" href="studio.css?v=soft-clay-backdrop">
<script src="staff.js?v=binding-options" defer></script>
</head>
<body>
<header class="frame top"><a href="/" class="brand">PrintBee</a></header>
<main class="frame">
<section class="section">

</form>
<p id="staff-status" role="status"></p>
<div id="staff-orders"></div>
</section>
</main>
</body>
</html>
