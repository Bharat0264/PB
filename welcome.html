<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6c84e">
<title>Welcome · PrintBee</title>
<link rel="icon" href="/printbee-tab-bee.png" type="image/png">
<link rel="stylesheet" href="/studio.css?v=clay-review">
<link rel="stylesheet" href="/welcome.css?v=clay-auth">
<script src="/session-sync.js?v=1" defer></script>
<script src="/customer-login.js?v=session-7d" defer></script>
<script src="/welcome-form.js?v=2" defer></script>
<script src="/welcome-mascot.js?v=1" defer></script>
<script src="/demo-login.js?v=1" defer></script>
<script src="/backend-check.js?v=1" defer></script>
</head>
<body class="welcome-page">
<main class="welcome-card" aria-labelledby="welcome-title">
  <section class="welcome-sign-in" aria-labelledby="signin-title">
    <div class="clay-toggle" role="radiogroup" aria-label="Sign in or sign up" data-mode="in">
      <input type="radio" name="mode" id="mode-in" value="in" checked><label for="mode-in">Sign in</label>
      <input type="radio" name="mode" id="mode-up" value="up"><label for="mode-up">Sign up</label>
      <span class="clay-thumb" aria-hidden="true"></span>
    </div>
    <h2 id="signin-title">Welcome back</h2>
    <p class="welcome-lede" id="mode-lede">Pick up where you left off. No password to remember.</p>
    <p id="account-email"></p>
    <p id="session-expired" class="welcome-expired" role="status" hidden>Your session expired after 7 days away. Please sign in again.</p>
    <a id="google-sign-in" class="welcome-button welcome-google" href="/api/auth/google?portal=welcome">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5h6.6c3.9-3.5 6.1-8.7 6.1-14.9z"/>
        <path fill="#34A853" d="M24 44c5.5 0 10.2-1.8 13.5-4.6l-6.6-5a12.2 12.2 0 0 1-18.2-6.4H6v5.2A20 20 0 0 0 24 44z"/>
        <path fill="#FBBC05" d="M12.7 28c-.9-2.6-.9-5.4 0-8V15H6a20 20 0 0 0 0 18z"/>
        <path fill="#EA4335" d="M24 12c3 0 5.6 1 7.7 3l5.7-5.7A19.4 19.4 0 0 0 24 4 20 20 0 0 0 6 15l6.7 5A12 12 0 0 1 24 12z"/>
      </svg>
      Continue with Google
    </a>
    <form id="email-sign-in" class="welcome-email">
      <p class="welcome-divider">or</p>
      <label for="welcome-email">Email address</label>
      <input id="welcome-email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" required maxlength="254" aria-describedby="email-hint">
      <p id="email-hint" class="welcome-hint" role="status"></p>
      <button class="welcome-button welcome-google" type="submit" id="email-submit">Email me a sign-in link</button>
    </form>
    <form id="email-sign-in-confirm" hidden>
      <button class="welcome-button welcome-google" type="submit">Confirm sign-in</button>
    </form>
    <form id="email-sign-out" hidden>
      <button class="welcome-button welcome-google" type="submit">Sign out</button>
    </form>
    <p id="email-login-status" role="status"></p>
    <p id="backend-notice" role="alert" hidden style="margin:12px 0 0;padding:10px 14px;border-radius:14px;background:#fff0c4;color:#6e4a05;font-weight:700"></p>
  </section>
  <section class="welcome-intro">
    <div class="mascot" aria-hidden="true">
      <svg viewBox="0 0 220 210" width="220" height="210" focusable="false">
        <defs>
          <radialGradient id="clay-body" cx="34%" cy="28%" r="80%"><stop offset="0" stop-color="#fff0b8"/><stop offset=".45" stop-color="#f5cb5c"/><stop offset="1" stop-color="#dba52b"/></radialGradient>
          <radialGradient id="clay-wing" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3dccb"/></radialGradient>
          <radialGradient id="clay-hand" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff6d2"/><stop offset="1" stop-color="#eac15a"/></radialGradient>
        </defs>
        <g class="m-float">
          <ellipse class="m-shadow" cx="110" cy="196" rx="58" ry="8"/>
          <ellipse class="m-wing" cx="52" cy="62" rx="26" ry="38" transform="rotate(-24 52 62)" fill="url(#clay-wing)"/>
          <ellipse class="m-wing" cx="168" cy="62" rx="26" ry="38" transform="rotate(24 168 62)" fill="url(#clay-wing)"/>
          <path d="M84 52 C80 30 70 22 62 20" class="m-antenna"/><circle cx="62" cy="20" r="7" class="m-ball"/>
          <path d="M136 52 C140 30 150 22 158 20" class="m-antenna"/><circle cx="158" cy="20" r="7" class="m-ball"/>
          <circle cx="110" cy="112" r="78" fill="url(#clay-body)"/>
          <path d="M44 128 Q110 150 176 128" class="m-stripe"/>
          <path d="M52 154 Q110 176 168 154" class="m-stripe"/>
          <circle cx="62" cy="126" r="11" class="m-cheek"/><circle cx="158" cy="126" r="11" class="m-cheek"/>
          <g class="m-eye"><circle cx="82" cy="100" r="21" class="m-white"/><circle class="pupil" cx="82" cy="102" r="10"/><circle class="m-glint" cx="78" cy="97" r="3.4"/></g>
          <g class="m-eye"><circle cx="138" cy="100" r="21" class="m-white"/><circle class="pupil" cx="138" cy="102" r="10"/><circle class="m-glint" cx="134" cy="97" r="3.4"/></g>
          <path class="m-mouth" d="M94 134 Q110 148 126 134"/>
          <path class="m-mouth-open" d="M92 132 Q110 160 128 132 Z"/>
          <ellipse class="m-hand m-hand-l" cx="82" cy="104" rx="25" ry="22" fill="url(#clay-hand)"/>
          <ellipse class="m-hand m-hand-r" cx="138" cy="104" rx="25" ry="22" fill="url(#clay-hand)"/>
        </g>
      </svg>
    </div>
    <h1 id="welcome-title">Welcome to PrintBee</h1>
    <p>Your local print studio.</p>
    <a class="welcome-button welcome-guest" href="/index.html">Continue as guest <span aria-hidden="true">→</span></a>
    <div id="demo-login" hidden></div>
  </section>
</main>
</body>
</html>
