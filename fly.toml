# Fly.io config for the PrintBee backend (server.py + SQLite).
# Change `app` to a unique name before the first deploy. Secrets are NOT stored here: set them with
# `fly secrets set ...` (see DEPLOY-VERCEL.md).
app = "printbee-api"
primary_region = "bom"          # Mumbai

[build]
  dockerfile = "Dockerfile"

[env]
  PRINTBEE_DATA_DIR = "/var/lib/printbee"
  # The public URL of the website (Vercel), not of this backend: cookies, CSRF checks and the
  # Google redirect URI all derive from it.
  PRINTBEE_ORIGIN = "https://pb-lake.vercel.app"
  PRINTBEE_PAYMENT_MODE = "disabled"      # "razorpay" once the Razorpay secrets are set

[mounts]
  source = "printbee_data"
  destination = "/var/lib/printbee"

[http_service]
  internal_port = 4188
  force_https = true
  auto_stop_machines = "off"    # SQLite lives on one volume: keep exactly one machine running
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
